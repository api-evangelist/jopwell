name: Jopwell
description: >-
  Jopwell was a career advancement and diversity-recruiting platform that connected Black, Latinx, and
  Native American students and professionals with employers for jobs, internships, and career resources.
  Founded in 2015 and backed by Andreessen Horowitz (a16z) and other investors, it was surfaced as an a16z
  portfolio company and added to the API Evangelist network as a stub. As of an enrichment probe on
  2026-07-19, the jopwell.com domain returns an HTTP 301 redirect to trueplatform.com (True, an executive
  search and talent-management firm), indicating the standalone Jopwell product is no longer operating. No
  public developer program, API, OpenAPI specification, documentation, or /.well-known/security.txt surface
  was found, so no API artifacts could be produced.
